<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto DB Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <h1 class="mb-3">Auto Database Analyzer</h1>

  <div class="mb-3 d-flex gap-2">
    <button id="btnTest" class="btn btn-outline-primary">Test Connection</button>
    <button id="btnMeta" class="btn btn-primary">Refresh Metadata</button>
  </div>

  <div class="row g-3">
    <div class="col-md-4">
      <h5>Catalog Outline</h5>
      <pre id="outline" class="p-2 small bg-light"></pre>
    </div>

    <div class="col-md-8">
      <ul class="nav nav-tabs" id="tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="ask-tab" data-bs-toggle="tab" data-bs-target="#ask" type="button" role="tab">Ask (NL → SQL)</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="explain-tab" data-bs-toggle="tab" data-bs-target="#explain" type="button" role="tab">Explain SQL</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="opt-tab" data-bs-toggle="tab" data-bs-target="#opt" type="button" role="tab">Optimize</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="know-tab" data-bs-toggle="tab" data-bs-target="#knowledge" type="button" role="tab">Knowledge</button>
        </li>
      </ul>

      <div class="tab-content border border-top-0 p-3" id="tabContent">
        <!-- Ask -->
        <div class="tab-pane fade show active" id="ask" role="tabpanel" aria-labelledby="ask-tab">
          <div class="mb-2">
            <label class="form-label">Question</label>
            <input id="question" class="form-control" placeholder="e.g., top 10 from dbo.Customers" />
          </div>
          <button id="btnAsk" class="btn btn-success mb-3">Run</button>
          <pre id="askOut" class="small bg-light p-2"></pre>
        </div>

        <!-- Explain -->
        <div class="tab-pane fade" id="explain" role="tabpanel" aria-labelledby="explain-tab">
          <div class="mb-2">
            <label class="form-label">SQL</label>
            <textarea id="sqlExplain" class="form-control" rows="6" placeholder="Paste a SELECT query"></textarea>
          </div>
          <button id="btnExplain" class="btn btn-secondary mb-3">Explain</button>
          <pre id="explainOut" class="small bg-light p-2"></pre>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
